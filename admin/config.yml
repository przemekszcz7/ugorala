backend:
  name: git-gateway
  repo: przemekszcz7/ugorala
  branch: main
  identity_url: https://auth.decapbridge.com/sites/e3432e15-9d66-4426-b482-5e005e0cdd46
  gateway_url: https://gateway.decapbridge.com

media_folder: "images"
public_folder: "/ugorala/images"

editor:
  preview: false

collections:
  - name: "strony"
    label: "Treść Strony"
    files:
      - file: "content/strona-glowna.json"
        label: "Strona Główna - Ranczo u Górala"
        name: "strona_glowna"
        fields:
          - { label: "Tytuł Strony", name: "tytul", widget: "string", default: "Ranczo u Górala" }

          - label: "Sekcja Hero (Główna)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Główne zdjęcie tła", name: "image", widget: "image" }
              - { label: "Tytuł", name: "title", widget: "string" }
              - { label: "Podtytuł", name: "subtitle", widget: "text" }
              - { label: "Etykieta lokalizacji", name: "badge", widget: "string" }
              - label: "Dodatkowe zdjęcia Hero"
                name: "images"
                widget: "list"
                required: false
                summary: '{{fields.zdjecie}}'
                fields:
                  - { label: "Zdjęcie", name: "zdjecie", widget: "image" }
                  - { label: "Podpis / ALT", name: "podpis", widget: "string", required: false }

          - label: "Sekcja 01 - O Nas"
            name: "o_domku"
            widget: "object"
            fields:
              - { label: "Zdjęcie główne", name: "image", widget: "image" }
              - { label: "Etykieta na zdjęciu", name: "image_badge", widget: "string" }
              - { label: "Nagłówek", name: "heading", widget: "string" }
              - { label: "Opis (paragraf 1)", name: "desc_1", widget: "text" }
              - { label: "Opis (paragraf 2)", name: "desc_2", widget: "text" }
              - { label: "Opis (paragraf 3)", name: "desc_3", widget: "text" }
              - label: "Dodatkowe zdjęcia sekcji"
                name: "images"
                widget: "list"
                required: false
                summary: '{{fields.zdjecie}}'
                fields:
                  - { label: "Zdjęcie", name: "zdjecie", widget: "image" }
                  - { label: "Podpis / ALT", name: "podpis", widget: "string", required: false }

          - label: "Sekcja 02 - Atrakcje"
            name: "sekcja_atrakcje"
            widget: "object"
            fields:
              - { label: "Zdjęcie główne", name: "image", widget: "image" }
              - { label: "Etykieta na zdjęciu", name: "image_badge", widget: "string" }
              - { label: "Nagłówek", name: "heading", widget: "string" }
              - label: "Dodatkowe zdjęcia sekcji"
                name: "images"
                widget: "list"
                required: false
                summary: '{{fields.zdjecie}}'
                fields:
                  - { label: "Zdjęcie", name: "zdjecie", widget: "image" }
                  - { label: "Podpis / ALT", name: "podpis", widget: "string", required: false }

          - label: "Sekcja 04 - Dla Kogo"
            name: "sekcja_dla_kogo"
            widget: "object"
            fields:
              - { label: "Zdjęcie główne", name: "image", widget: "image" }
              - { label: "Etykieta na zdjęciu", name: "image_badge", widget: "string" }
              - { label: "Nagłówek", name: "heading", widget: "string" }
              - label: "Dodatkowe zdjęcia sekcji"
                name: "images"
                widget: "list"
                required: false
                summary: '{{fields.zdjecie}}'
                fields:
                  - { label: "Zdjęcie", name: "zdjecie", widget: "image" }
                  - { label: "Podpis / ALT", name: "podpis", widget: "string", required: false }

          - label: "Sekcja 05 - Kontakt"
            name: "sekcja_kontakt"
            widget: "object"
            fields:
              - { label: "Zdjęcie główne", name: "image", widget: "image" }
              - { label: "Etykieta na zdjęciu", name: "image_badge", widget: "string" }
              - { label: "Nagłówek", name: "heading", widget: "string" }
              - label: "Dodatkowe zdjęcia sekcji"
                name: "images"
                widget: "list"
                required: false
                summary: '{{fields.zdjecie}}'
                fields:
                  - { label: "Zdjęcie", name: "zdjecie", widget: "image" }
                  - { label: "Podpis / ALT", name: "podpis", widget: "string", required: false }

          - label: "Adres i Kontakt"
            name: "kontakt"
            widget: "object"
            fields:
              - { label: "Adres", name: "adres", widget: "string", default: "Żarnowa 285, 38-100 Strzyżów" }
              - { label: "Województwo", name: "wojewodztwo", widget: "string", default: "podkarpackie" }
              - { label: "Telefon", name: "telefon", widget: "string", default: "791 757 553" }

          - label: "Pojemność i Pokoje"
            name: "pokoje"
            widget: "object"
            fields:
              - { label: "Liczba miejsc", name: "liczba_miejsc", widget: "string", default: "Do 10 osób (docelowo 18)" }
              - { label: "Opis sypialni", name: "sypialnie", widget: "string", default: "4 niezależne sypialnie" }
              - { label: "Opis łazienek", name: "lazienki", widget: "string", default: "Każdy pokój posiada prywatną, osobną łazienkę" }

          - label: "Teren i Udogodnienia"
            name: "udogodnienia"
            widget: "list"
            summary: '{{fields.element}}'
            field: { label: "Udogodnienie", name: "element", widget: "string" }

          - label: "Lista Atrakcji w Okolicy"
            name: "atrakcje"
            widget: "list"
            fields:
              - { label: "Kategoria", name: "kategoria", widget: "string" }
              - { label: "Opis", name: "opis", widget: "text" }

          - label: "Galeria Główna"
            name: "galeria"
            widget: "list"
            summary: '{{fields.podpis}}'
            fields:
              - { label: "Zdjęcie", name: "zdjecie", widget: "image" }
              - { label: "Podpis / Tekst alternatywny (ALT)", name: "podpis", widget: "string", required: false }

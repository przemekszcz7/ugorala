<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Zarządzania - Ranczo u Górala</title>
  <!-- Skrypt Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Skrypt Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Zastąp poniższy URL dokładnym adresem Twojej strony wygenerowanym przez Netlify!
    // Znajdziesz go w panelu Netlify (np. https://ranczo-u-gorala.netlify.app)
    if (window.netlifyIdentity) {
      window.netlifyIdentity.init({
        APIUrl: "https://ugorala.netlify.app/.netlify/identity"
      });

      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.reload();
          });
        }
      });
    }
  </script>
</body>
</html>
